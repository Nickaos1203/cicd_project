name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Installer ruff
        run: uv pip install ruff
      
      - name: Installer les dépendances
        run: uv sync

      - name: Exécuter ruff check
        run: uv run ruff check .

      - name: Vérifier le formatage
        run: uv run ruff format --check

  typecheck:
    name: Vérification des types
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Installer mypy
        run: uv pip install mypy
      
      - name: Installer les dépendances
        run: uv sync

      - name: Exécuter mypy
        run: uv run mypy app/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Installer Bandit et Safety
        run: uv pip install bandit safety

      - name: Installer les dépendances
        run: uv sync

      - name: Bandit (static analysis)
        run: uv run bandit -r app/

      - name: Safety (check dependency vulnerabilities)
        run: uv run safety check
  
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
        
      - name: Installer pytest
        run: uv pip install pytest

      - name: Installer les dépendances
        run: uv sync

      - name: Exécuter les tests
        run: uv run pytest --cov=app --cov-report=term --cov-report=xml
